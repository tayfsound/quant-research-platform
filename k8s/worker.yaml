apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: qrp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: qrp-api:latest  # same image as api — worker just runs a different entrypoint
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "services.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
          envFrom:
            - configMapRef:
                name: qrp-config
            - secretRef:
                name: qrp-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          # No HTTP probes — a worker has no server. `celery inspect ping`
          # is the standard liveness check for a Celery worker process.
          livenessProbe:
            exec:
              command: ["celery", "-A", "services.celery_app", "inspect", "ping", "-d", "celery@$(HOSTNAME)"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: qrp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
