apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: qrp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # `:latest` is a placeholder — a real deploy should pin an actual
          # version/commit tag (immutable rollouts, real rollback). Explicit
          # IfNotPresent because K8s defaults to Always for `:latest`, which
          # tries to pull from a registry even for an image already loaded
          # locally (this broke local kind-cluster testing until fixed).
          image: qrp-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: qrp-config
            - secretRef:
                name: qrp-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          # startupProbe: loading sentence-transformers/torch at process
          # start takes longer than the liveness probe's initialDelaySeconds
          # allows — without this, kubelet kills and restarts the container
          # for being "unhealthy" before it ever finishes starting up,
          # producing an endless crash loop. Verified against a real kind
          # cluster: the api pod restart-looped on liveness failures
          # ("connection refused" — nothing was listening on 8000 yet) until
          # this was added. Liveness/readiness only start being checked
          # after this succeeds once.
          startupProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30 # up to 150s to finish starting
          # These probes hit the real /ready and /live endpoints fixed in
          # Sprint 28 — /ready actually checks DB connectivity now (it used
          # to unconditionally return "ready", which would have made this
          # probe worthless: Kubernetes would route traffic to pods that
          # can't reach the database).
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: qrp
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: qrp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
