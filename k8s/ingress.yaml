apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qrp-ingress
  namespace: qrp
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: qrp.local  # replace with your real domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
