[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-research-platform"
version = "0.1.0"
description = "AI Quant Research Operating System"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "orjson>=3.10.0",
    "structlog>=24.4.0",
    "pgvector>=0.3.0",
    "numpy>=2.0.0",
    "psutil>=6.0.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    # Sprint 25-26: these were already imported throughout the codebase
    # (services/llm_reasoner.py, ml/training/, database/migrations/ via
    # alembic, observability/metrics.py via prometheus_client) but never
    # declared — `pip install .` in a fresh environment (i.e. the Docker
    # image built this sprint) never actually worked before this. Verified
    # by building the real Docker image and running `python -c "from
    # api.main import app"` inside it.
    "alembic>=1.13.0",
    "prometheus-client>=0.20.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.0",
    "torch>=2.3.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "sortedcontainers>=2.4.0",
    "filelock>=3.13.0",
    "websockets>=13.0",
    "celery>=5.4.0",
    # Faz 194: kripto-olmayan varlıklar (endeks/emtia/hisse) için — Binance
    # bunları sağlamıyor, ücretsiz/key gerektirmeyen tek pratik seçenek.
    "yfinance>=1.5.0",
    # Faz 200: pairs trading — gerçek Engle-Granger cointegration testi
    # (ADF üzerine kurulu) elle yazılmıyor, standart, iyi test edilmiş
    # statsmodels.tsa.stattools.coint kullanılıyor.
    "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-rerunfailures>=14.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=3.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["dashboard/"]
allow_redefinition = true
disallow_any_generics = false

[tool.hatch.build.targets.wheel]
# Faz 230: kritik bulgu — agents/backtest/engines/services/meta_optimizer
# bu listede hiç yoktu. Dockerfile `pip install .` (editable DEĞİL)
# kullandığı için, bu paketler wheel'e hiç dahil edilmiyordu — şu an
# `COPY . .` + WORKDIR /app + CWD-bazlı import sayesinde sessizce
# çalışıyor (repo'nun ham kaynak dizinleri zaten /app'te duruyor), ama bu
# gerçek `pip install .` semantiğine güvenmiyor, sadece şans eseri
# çalışıyor — farklı bir WORKDIR/entrypoint ile veya bu paketi gerçek bir
# bağımlılık olarak başka bir yerden kurunca patlardı.
packages = ["contracts", "exchange_gateway", "market_data", "ml", "rl", "strategies", "simulator", "risk", "analytics", "api", "database", "events", "config", "observability", "agents", "backtest", "engines", "services", "meta_optimizer"]


[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]
# Faz 230: kullanıcı bulgusu — "flaky test için retry mekanizması eklenmeli."
# Bu oturum boyunca tekrar tekrar doğrulanan, bilinen non-regression
# flakiness kaynağı: full-suite'te (izole çalışınca geçen) embedding-mock
# TypeError'ı. --only-rerun bilerek DAR tutuldu — SADECE bu bilinen hata
# imzasına uyan testler yeniden denenir, farklı bir hatayla başarısız olan
# (gerçek bir regresyon olabilecek) bir test asla sessizce maskelenmez.
#
# Faz 255 review notu: JSONDecodeError imzası burada DAHA ÖNCE de vardı
# (agent_memory.json'a eşzamanlı yazımdan) — Faz 246'da kök nedeni gerçekten
# çözüldü (dosya kilidi + atomik yazma + kilit-altında-yeniden-okuma).
# Listede kalması artık gereksiz risk (yeni bir regresyon aynı imzayı
# üretirse maskelenebilirdi) — kaldırıldı.
addopts = "--reruns 2 --only-rerun \"received an invalid combination of arguments\""
