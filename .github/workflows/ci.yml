name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: quantpass
          POSTGRES_DB: quantdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Faz 230: kritik bulgu — CI en az Faz 189'dan (kök conftest.py'nin
      # DATABASE_URL_SYNC/DATABASE_URL/TIMESCALE_URL'i pytest import
      # edilmeden ÖNCE quantdb_test'e zorla çevirmesi) beri kırıktı.
      # `alembic upgrade heads` burada `quantdb`'yi migrate ediyordu ama
      # pytest gerçekte `quantdb_test`'e bağlanıyordu — o veritabanı hiç
      # var olmuyordu ("database quantdb_test does not exist"), DB'ye
      # dokunan HER test hata veriyordu. `gh run list` ile doğrulandı: en
      # az Faz 214d'den beri (muhtemelen çok daha önce) her push kırmızıydı,
      # hiç kimse fark etmemişti çünkü gerçek doğrulama hep yerel makinede
      # yapılıyordu. Artık postgres servisi zaten quantdb_test olarak
      # başlıyor (yukarıda), migration/testler de aynı DB'ye karşı çalışıyor.
      - name: Run tests
        run: |
          alembic upgrade heads
          pytest -q --ignore=tests/test_ml.py
        env:
          DATABASE_URL: postgresql+asyncpg://quant:quantpass@localhost:5432/quantdb_test
          DATABASE_URL_SYNC: postgresql+psycopg2://quant:quantpass@localhost:5432/quantdb_test
          REDIS_URL: redis://localhost:6379/0

      - name: Check CURRENT_STATE.md is consistent with the actual test suite
        run: python scripts/check_docs_consistency.py
